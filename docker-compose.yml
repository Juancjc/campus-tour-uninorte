services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: campus-tour-uninorte:local
    restart: unless-stopped
    environment:
      APP_NAME: "${APP_NAME:-Campus Tour UniNorte}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY:?Defina APP_KEY no Portainer}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:?Defina APP_URL no Portainer}"
      APP_PORT: "${APP_PORT:-7674}"
      FORCE_HTTPS: "${FORCE_HTTPS:-true}"
      APP_LOCALE: "${APP_LOCALE:-pt_BR}"
      APP_FALLBACK_LOCALE: "${APP_FALLBACK_LOCALE:-pt_BR}"
      APP_FAKER_LOCALE: "${APP_FAKER_LOCALE:-pt_BR}"
      APP_MAINTENANCE_DRIVER: "${APP_MAINTENANCE_DRIVER:-file}"
      BCRYPT_ROUNDS: "${BCRYPT_ROUNDS:-12}"
      LOG_CHANNEL: "${LOG_CHANNEL:-stderr}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      DB_CONNECTION: "${DB_CONNECTION:-pgsql}"
      DB_HOST: "${DB_HOST:?Defina DB_HOST no Portainer}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_DATABASE: "${DB_DATABASE:?Defina DB_DATABASE no Portainer}"
      DB_USERNAME: "${DB_USERNAME:?Defina DB_USERNAME no Portainer}"
      DB_PASSWORD: "${DB_PASSWORD:?Defina DB_PASSWORD no Portainer}"
      DB_SSLMODE: "${DB_SSLMODE:-prefer}"
      SESSION_DRIVER: "${SESSION_DRIVER:-database}"
      SESSION_LIFETIME: "${SESSION_LIFETIME:-120}"
      SESSION_ENCRYPT: "${SESSION_ENCRYPT:-true}"
      SESSION_PATH: "${SESSION_PATH:-/}"
      SESSION_DOMAIN: "${SESSION_DOMAIN:-}"
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-true}"
      SESSION_SAME_SITE: "${SESSION_SAME_SITE:-lax}"
      CACHE_STORE: "${CACHE_STORE:-database}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"
      DB_QUEUE_RETRY_AFTER: "${DB_QUEUE_RETRY_AFTER:-120}"
      QUEUE_FAILED_DRIVER: "${QUEUE_FAILED_DRIVER:-database-uuids}"
      PM2_APP_NAME: "${PM2_APP_NAME:-campus-tour-queue}"
      FILESYSTEM_DISK: "${FILESYSTEM_DISK:-local}"
      BROADCAST_CONNECTION: "${BROADCAST_CONNECTION:-log}"
      MAIL_API_URL: "${MAIL_API_URL:-https://nest.juancjc.com.br/api-nest-central-jc}"
      MAIL_API_KEY: "${MAIL_API_KEY:?Defina MAIL_API_KEY no Portainer}"
      MAIL_API_TOKEN: "${MAIL_API_TOKEN:?Defina MAIL_API_TOKEN no Portainer}"
      MAIL_API_CONNECT_TIMEOUT: "${MAIL_API_CONNECT_TIMEOUT:-3}"
      MAIL_API_TIMEOUT: "${MAIL_API_TIMEOUT:-10}"
      ADMIN_NAME: "${ADMIN_NAME:-Administrador}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:?Defina ADMIN_EMAIL no Portainer}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD no Portainer}"
      VITE_APP_NAME: "${VITE_APP_NAME:-Campus Tour UniNorte}"
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - campus_uploads:/var/www/html/storage/app/public
      - campus_logs:/var/www/html/storage/logs
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - campus_network

  postgres:
    image: postgres:17-alpine
    profiles:
      - local
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_DATABASE:-campus_tour}"
      POSTGRES_USER: "${DB_USERNAME:-campus_tour}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Defina DB_PASSWORD no ambiente}"
    volumes:
      - campus_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-campus_tour} -d ${DB_DATABASE:-campus_tour}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - campus_network

volumes:
  campus_postgres:
  campus_uploads:
  campus_logs:

networks:
  campus_network:
    driver: bridge
